# Local quality and security gate (ADR-0008). Install once: `pre-commit install`.
# Update hook versions with `pre-commit autoupdate` (and review the diff).
repos:
  # Secrets: block any commit that contains a credential (also covers docs/sessions/).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system        # uses the installed binary: `brew install gitleaks`
        pass_filenames: false      # it scans the staged diff itself

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Shell scripts (hooks and tools) are code too.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # GitHub Actions security: unpinned actions, template injection, excessive permissions, etc.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  # Monorepo rules (ADR-0010, ADR-0013): apps never depend on each other, one writer per dataset,
  # every app and contract folder registered, and the generated system map up to date. Needs jq.
  - repo: local
    hooks:
      - id: system-map
        name: system map (components.json, apps/, shared/, architecture.md)
        entry: tools/monorepo/system-map.sh --check
        language: script
        pass_filenames: false
        files: ^(docs/architecture/|apps/|shared/)

  # Python quality gate (ADR-0014). Needs uv; every command runs in the locked workspace environment.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, complexity, security rules)
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: qg-boundaries
        name: python boundaries (components.json, both levels)
        entry: uv run --frozen qg-boundaries
        language: system
        pass_filenames: false
        files: (\.pyi?$|components\.json$|pyproject\.toml$)
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: uv run --frozen pip-audit --skip-editable --progress-spinner off
        language: system
        pass_filenames: false
        files: (uv\.lock|pyproject\.toml)$

  # Domain models (ADR-0016, spec 0002): every domain folder is consistent, its generated/ files match
  # the YAML sources, and the generated SHACL behaves as the samples say.
  - repo: local
    hooks:
      - id: domain-model
        name: domain models (model, freshness, samples)
        entry: uv run --frozen domain-model check --all
        language: system
        pass_filenames: false
        files: ^(data/|tools/domain-model/)
