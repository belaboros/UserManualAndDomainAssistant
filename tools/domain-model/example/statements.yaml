# The domain expert's statements, verbatim (example domain for the domain-model tool, spec 0002).
statements:
  - id: S1
    date: 2026-11-14
    level: 1
    text: "A library lends items to its members. A loan records which items a member borrowed, when it started and when it is due."
  - id: S2
    date: 2026-11-14
    level: 1
    text: "Items are books, audio/visual items and e-books. A loan has between 1 and 5 items. The due date of a loan is after its start date."
  - id: S3
    date: 2026-11-14
    level: 2
    text: "A library has branches. A loan is active or returned; a returned loan has a return date. An active loan is an open loan. Librarians issue loans."
  - id: S4
    date: 2026-11-14
    level: 3
    text: "Branches have 2 to 4 shelves. Items are located in a branch. A loan returned after its due date is a late loan. Some books are reference books."
