[project]
name = "domain-model"
version = "0.1.0"
description = "Generates every format, diagram and level view of a domain model from YAML sources (spec 0002, ADR-0016)."
requires-python = ">=3.15"
dependencies = [
  "rdflib==7.6.0",
  "pyshacl==0.40.2",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
]

[project.scripts]
domain-model = "domain_model.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
