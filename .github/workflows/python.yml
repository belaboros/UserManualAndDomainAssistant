name: python

# Python quality gate (ADR-0014): lint + complexity, formatting, strict types, boundaries from
# components.json, tests, the domain-model check (ADR-0016) and the dependency audit, on every push
# to main and every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint and complexity (ruff)
        run: uv run --frozen ruff check .
      - name: Formatting (ruff format)
        run: uv run --frozen ruff format --check .
      - name: Types (mypy strict)
        run: uv run --frozen mypy
      - name: Boundaries (components.json)
        run: uv run --frozen qg-boundaries
      - name: Tests (pytest)
        run: uv run --frozen pytest
      - name: Domain models (check)
        run: uv run --frozen domain-model check --all
      - name: Dependency audit (pip-audit)
        run: uv run --frozen pip-audit --skip-editable --progress-spinner off
