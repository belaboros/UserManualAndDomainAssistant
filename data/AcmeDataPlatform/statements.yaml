# The domain expert's statements, verbatim, in the order given (idea 0001). Items in ontology.yaml
# cite them in `source`. Format: tools/domain-model/README.md.
statements:
  - id: S1
    date: 2026-11-14
    level: 1
    text: "Core concepts: AcmeDataPlatform; platform service; platform resource; platform team; product team; environments: EXP, DEV, ACC, PRD"
  - id: S2
    date: 2026-11-14
    level: 1
    text: "AcmeDataPlatform consists of \"platform services\"."
  - id: S3
    date: 2026-11-14
    level: 1
    text: "Each platform service is owned by a platform team."
  - id: S4
    date: 2026-11-14
    level: 1
    text: "Platform services are used by product teams to create platform resources."
  - id: S5
    date: 2026-11-14
    level: 1
    text: "Each platform resource is owned by the product team which created it."
  - id: S6
    date: 2026-11-14
    level: 1
    text: "Platform services can be deployed to the environments."
  - id: S7
    date: 2026-11-14
    level: 1
    text: "Platform resources can be created in the EXP or in the DEV environment."
  - id: S8
    date: 2026-11-14
    level: 1
    text: "Platform resources can be promoted to upper environments in 2 ways: EXP->DEV->ACC->PRD or DEV->ACC->PRD"
  - id: S9
    date: 2026-11-14
    level: 1
    text: "Platform resource can be one of those: \"data product\", dashboard, \"ML model\", \"AI model\", \"AI/analytical application\""
  - id: S10
    date: 2026-11-14
    level: 1
    text: "(answers to Q44-Q46) A platform resource is created with one or more platform services. Platform team and product team are two kinds of \"team\". A platform service can be deployed to any environment, independently."
  - id: S11
    date: 2026-11-14
    level: 1
    text: "(answer to Q48) A platform resource is either created in EXP environment first and then promoted to DEV, ACC and PRD. Or it is created in DEV and promoted to ACC and PRD."
  - id: S12
    date: 2026-11-14
    level: 1
    text: "(answer to Q49) EXP is the environment for experimentation. This is an environment for teams who do not know what they want or how they want to implement it. Or just want to learn the new technologies."
  - id: S13
    date: 2026-11-14
    level: 1
    text: "(answer to Q51) Only automated CI/CD pipelines are allowed to deploy anything to ACC environment. Creating platform resources manually in ACC environment is not allowed and prevented by policy."
  - id: S14
    date: 2026-11-14
    level: 1
    text: "(answer to Q52) Platform resources have to be promoted to ACC first then some of the modifications can be promoted further to PRD environment."
  - id: S15
    date: 2026-11-14
    level: 1
    text: "(answer to Q53) Those are all the currently available platform resources related to end-to-end use-cases. But you are right those platform resources may consist of multiple sub-components. I will create those statements for level-2."
  - id: S16
    date: 2026-11-14
    level: 1
    text: "(answer to Q54) CI/CD pipeline will be introduced for level-2. It is only needed for teams which need to build something."
  - id: S17
    date: 2026-11-14
    level: 1
    text: "(answer to Q55) They are not mutually exclusive. Example. An \"analytical application\" may come with a business \"dashboard\" as well."
  - id: S18
    date: 2026-11-14
    level: 1
    text: "(answer to Q57) Let's go with composition for level-2. A platform resource may consist of multiple (nested / sub) platform resourcs. The (nested / sub) platform resources belong to their (parent) platform resource and cannot live on their own and they are created/owned by the same product team."
  - id: S19
    date: 2026-11-14
    level: 1
    text: "(answer to Q58) Yes, nested platform resources are promoted with their parent platform resource. In fact, promoting a data product from DEV to ACC means: - promote the contract - promote the data pipeline - the data asset will be automatically built from parent/upstream data products automatically. This is also a level-2 information."
  - id: S20
    date: 2026-11-14
    level: 1
    text: "(answer to Q59) Extra info for level-2: (nested/sub) platform resources of a data product: - contract (mandatory) - data pipeline (mandatory) - compute cluster definition (mandatory) - workspace infra definition (mandatory) - data asset(s) NOTE: they are typically tables and views in case of structured data products (mandatory) - dashboards which show the health of the data product (e.g.: how much the data quality rules are fulfilled) (mandatory) NOTE: (nested/sub) platform resources of an \"analytical/AI application\": - dashboard(s) e.g.: showing the health or important business metrics of the application (optional) - data product (optional) - ML model (optional) - AI model (optional) (nested/sub) platform resources of a dashboard: - data product (optional) - ML model (optional) - AI model (optional)"
  - id: S21
    date: 2026-11-14
    level: 1
    text: "Extra info for level-1: Product teams can subscribe to platform resources."
  - id: S22
    date: 2026-11-14
    level: 1
    text: "(answer to Q61) R24: yes, those are the only (nested/sub) platform resources of a data product."
  - id: S23
    date: 2026-11-14
    level: 1
    text: "(answer to Q62) ML/AI models may contain a data product (optional)"
  - id: S24
    date: 2026-11-14
    level: 1
    text: "(answer to Q60) Level-2: - a \"data product\" may depend on parent/upstream data product(s). Such a data product is also called as a child/downstream data product of its parent(s). - the parent/child relationship between the data products is called as \"lineage\" - the data asset is always built by a \"data pipeline\". The data pipeline reads the content of the data asset(s) of the parent data products and populates the data assets of the child data product."
  - id: S25
    date: 2026-11-14
    level: 1
    text: "(answer to open point 1) Level-2 information: - data products can be created via ingestion. - An \"ingestion data pipeline\" ingests data from an (internal or external) source service or data source. example-1: ingesting the currency exchange rates from an official external API exposed by a bank or other financial institute. example-2: ingesting the product prices for the next month from internal *.csv files example-3: ingesting the orders from the OrderManagement service - the ingestion produces a data asset in the RAW layer. - then one or more \"processing data pipelines\" perform some of the transformations (cleansing, curation, filtering, enrichment, aggregation) across the RAW->CURATED->SERVING medallion layers Data products can be created also from parent/upstream data products."
  - id: S26
    date: 2026-11-14
    level: 1
    text: "(answer to open point 2) Level-2: Yes, lineage is a DAG (Directed Acyclic Graph) and cannot contain cycles/loops."
  - id: S27
    date: 2026-11-14
    level: 1
    text: "(answer to open point 3) Level-2: An \"analytical/AI application\" can contain a \"data product\" as a (nested/sub) platform resource, and the data product also has its own (nested/sub) platform resources. But there is no circular dependency in this nested structure and all the (nested/sub) platform resources of a (top-level) platform resource are created and owned by the same product team."
  - id: S28
    date: 2026-11-14
    level: 1
    text: "Level-2: A dashboard, \"Analytical/AI application\" may also consume/reference/use to a \"data product\", \"ML model\", \"AI model\" created by another product team. In this case they are no nested/sub platform resources, but referenced upstream/parent platform resources, which are deployed separately and can live independently."
  - id: S29
    date: 2026-11-14
    level: 1
    text: "(correction of R41) data products may also consume other data products, those are the parent/upstream data products."
  - id: S30
    date: 2026-11-14
    level: 1
    text: "(answer to draft 6) No. An ingestion data pipeline only ingests and stores everything in the RAW layer as raw/unchenged data. i.e.: transformations are not allowed. A processing data pipeline is not allowed to ingest. And each data pipeline can do only one of those things."
  - id: S31
    date: 2026-11-14
    level: 1
    text: "(answer to open point 7) there are no nested/sub resources under a data pipeline, contract, ..."
  - id: S32
    date: 2026-11-14
    level: 1
    text: "(answer to open point 8) yes, A dashboard can also consum an independent parent/upstream data product (created by a the same or another product team)."
  - id: S33
    date: 2026-11-14
    level: 1
    text: "(answer to draft R42) Dashboards can be consumed by human users: (user principlas). Data products, ML models and AI models are consumed by downstream/child application consumers (service principals)."
  - id: S34
    date: 2026-11-14
    level: 1
    text: "(answer to Q74) Level-3: A \"Service principal\" represents the identity of an application, data pipeline or other automation whch is not performed by a human. A \"user principla\" represents the identity of a user or group of users who can look at dashboards, use \"analytical/AI applications\""
  - id: S35
    date: 2026-11-14
    level: 1
    text: "(answer to draft R51) level-3: yes, \"application\" can be either an internal \"analytical/AI application\" which runs inside the AcmeDataPlatform and consumes the platform resources, or an external application that runs outside of the data platform and consumes the \"externally exposed/shared\" platform resources."
  - id: S36
    date: 2026-11-14
    level: 1
    text: "Extra statements for level-2: Each data product has a \"DataProductOwner\", who is member of the owner product team"
  - id: S37
    date: 2026-11-14
    level: 1
    text: "Each ML model, AI model, and other platform resource has a \"ProductPwner\" who is member of the owner product team"
  - id: S38
    date: 2026-11-14
    level: 1
    text: "By default, each platform resource (in EXP, DEV, ACC, PRD) is exposed (automatically) in catalogs (finabile) for anyone incide ACME company."
  - id: S39
    date: 2026-11-14
    level: 1
    text: "By default platform resources cannot be used/consumed/accessed by other product teams and applications."
  - id: S40
    date: 2026-11-14
    level: 1
    text: "SubscriptionRequest can be creaeted by a (Data)ProductOwner to an existing platform resource in order to consume it to build a new platform resource or consume it by another application"
  - id: S41
    date: 2026-11-14
    level: 1
    text: "the (Data)ProductOwner of the subscribed platform resource receives the SubscriptionRequest from the other (Data)ProductOwner and either approves it or rejects it."
  - id: S42
    date: 2026-11-14
    level: 1
    text: "After approval the subscribed platform resource will be accessible for the consumer appolication and its owner team."
  - id: S43
    date: 2026-11-14
    level: 1
    text: "(correction of R53, R54) each (top-level) platform resource has exactly one ProductOwner or DataProductOwner. each platform resource (which is not a sub platform resource has exactly one product owner."
  - id: S44
    date: 2026-11-14
    level: 1
    text: "(correction of R64) A platform resource can be consumed by a team/app (different than the owner team) only after an approved subscription request."
  - id: S45
    date: 2026-11-14
    level: 1
    text: "(answer to draft R60) SubscriptionRequest to a platform resource for a new data product, application or other platform resource is created by the owner of that new application, dataproduct or platform resource."
  - id: S46
    date: 2026-11-14
    level: 1
    text: "(correction of R64) any platform resource can be consumed by a new application, child data product or child platform resource after approved subscription request."
  - id: S47
    date: 2026-11-14
    level: 1
    text: "Special case: a product team creats a data product \"A\". If the same product team creates a new child platform resource or application which needs to consume the \"A\" data product. Approved subscription is needed ieven in this case. But in this case the same DataProductOwner will be the approver as well as the consumer."
  - id: S48
    date: 2026-11-14
    level: 1
    text: "(answer to open point 1) Each external application (which runs outside of the AcmeDataPlatform) has exactly one product owner. That product owner can create subscription request to platform resources."
  - id: S49
    date: 2026-11-14
    level: 1
    text: "(answer to open point 2) There is a catalog per environment. Exposure can be turned off."
  - id: S50
    date: 2026-11-14
    level: 1
    text: "(answer to open point 3) Yes, each employee (ProductOwners, DataProductOwners or other employees) has a exactly one user principal."
  - id: S51
    date: 2026-11-14
    level: 2
    text: "(answer to open point 4) Level-2: users also need a subscription. When a product owner creates a subscription for his/her new consumer application/platform resource, he/she can include some/all of the team members to get access as well."
  - id: S52
    date: 2026-11-14
    level: 2
    text: "Level-3: the access for users can be differentiated per environment. e.g.: Grant SELECT permission on the tables/view for users in EXP, DEV and ACC environments. But not in PRD where sensitive/PII data is stored."
  - id: S53
    date: 2026-11-14
    level: 2
    text: "Level-3: developers of the consumer application can request time-limited elevated permissions and run SELECT commands on the tables/views in their data product or in the parent data products in case of an incident resolution or for debugging purposes."
  - id: S54
    date: 2026-11-14
    level: 2
    text: "(answer to open point 6) Yes, each (top-level or nested) platform resource is created via a platform service. e.g.: tables and views are created via Databricks/Snowflake or other EDW/analytical services."
  - id: S55
    date: 2026-11-14
    level: 2
    text: "(answer to draft R72) level-3 info: by default, the team members of the owning team of a platform resource can read their own platform resources. The product owner may limit this intentionally. E.g.: Developers can run SELECT commands or view the dashboard in the EXP, DEV, ACC environments, but not in the PRD environment which contains sensitive/PII information."
  - id: S56
    date: 2026-11-14
    level: 2
    text: "(answer to draft R76) no general rule. Product owner decides for each case."
  - id: S57
    date: 2026-11-14
    level: 2
    text: "(answer about R78) R78: yes, same restrictions to dashboards as well."
