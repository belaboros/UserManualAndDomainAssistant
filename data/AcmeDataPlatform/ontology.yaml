    statement: "A data product is created via ingestion or from parent data products."
    sparql:
      focus: DataProduct
      select: |
        SELECT $this WHERE {
          FILTER NOT EXISTS { ?pipeline adp:belongsTo $this . ?pipeline a adp:IngestionDataPipeline . }
          FILTER NOT EXISTS { $this adp:dependsOn ?parent . }
        }

  - id: R39
    level: 2
    status: confirmed
    source: [S26]
    statement: "Lineage is a directed acyclic graph: a data product never depends on itself, directly or indirectly."
    sparql:
      focus: DataProduct
      select: |
        SELECT $this WHERE { $this adp:dependsOn+ $this . }

  - id: R40
    level: 2
    status: confirmed
