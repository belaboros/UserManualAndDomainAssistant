      select: |
        SELECT $this WHERE {
          ?sub adp:belongsTo $this .
          FILTER NOT EXISTS { ?sub a ?kind . FILTER (?kind IN (adp:DataProduct)) }
        }

  - id: R29
    level: 2
    status: confirmed
    source: [S24]
    statement: "A data product that depends on another data product is a child data product."
    derive:
      focus: DataProduct
      if: {path: dependsOn, min: 1}
      add: {predicate: a, object: ChildDataProduct}

  - id: R30
    level: 2
    status: confirmed
    source: [S24]
    statement: "A data product another data product depends on is a parent data product."
    derive:
      focus: DataProduct
      if: {path: ^dependsOn, min: 1}
      add: {predicate: a, object: ParentDataProduct}

  - id: R31
    level: 2
    status: confirmed
    source: [S24]
    statement: "A data asset is always built by a data pipeline."
    cardinality: {focus: DataAsset, path: ^populates, min: 1}

  - id: R32
    level: 2
    status: confirmed
    source: [S24]
    statement: "A data pipeline populates only the data assets of its own data product."
    sparql:
      focus: DataPipeline
      select: |
        SELECT $this WHERE {
          $this adp:populates ?asset .
          FILTER NOT EXISTS { $this adp:belongsTo ?product . ?asset adp:belongsTo ?product . }
        }

  - id: R33
    level: 2
    status: confirmed
    source: [S24, S25]
    statement: "A data pipeline reads only data assets of its own data product or of the parent data products of its data product."
    sparql:
      focus: DataPipeline
      select: |
        SELECT $this WHERE {
          $this adp:reads ?asset .
          FILTER NOT EXISTS {
            $this adp:belongsTo ?product .
            { ?asset adp:belongsTo ?product } UNION { ?product adp:dependsOn ?parent . ?asset adp:belongsTo ?parent }
          }
        }

  - id: R34
    level: 2
    status: confirmed
    source: [S25]
    statement: "The ingestion produces a data asset in the RAW layer."
    implies:
      focus: DataAsset
      if: {path: ^populates, class: IngestionDataPipeline}
      then: {path: inLayer, has_value: RAW}

  - id: R35
    level: 2
    status: confirmed
    source: [S25]
    statement: "A processing data pipeline populates only data assets in the CURATED or SERVING layer."
    values: {focus: ProcessingDataPipeline, path: populates/inLayer, in: [CURATED, SERVING]}

  - id: R36
    level: 2
    status: confirmed
    source: [S25]
    statement: "Each data asset is in exactly one medallion layer."
    cardinality: {focus: DataAsset, path: inLayer, min: 1, max: 1}

  - id: R37
    level: 2
    status: confirmed
    source: [S25]
    statement: "An ingestion data pipeline ingests data from at least one source service or data source."
    cardinality: {focus: IngestionDataPipeline, path: ingestsFrom, min: 1}

  - id: R38
    level: 2
    status: confirmed
