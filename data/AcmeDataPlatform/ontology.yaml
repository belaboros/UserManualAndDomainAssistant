          ?sub adp:belongsTo $this .
          FILTER NOT EXISTS { ?sub a ?kind . FILTER (?kind IN (adp:DataProduct)) }
        }

  - id: R28
    level: 2
    status: confirmed
    source: [S23]
    statement: "An AI model consists only of data products."
    sparql:
