    sparql:
      focus: AIAnalyticalApplication
      select: |
        SELECT $this WHERE {
          ?sub adp:belongsTo $this .
          FILTER NOT EXISTS { ?sub a ?kind . FILTER (?kind IN (adp:Dashboard, adp:DataProduct, adp:MLModel, adp:AIModel)) }
        }

  - id: R26
    level: 2
    status: confirmed
    source: [S20]
    statement: "A dashboard consists only of the sub platform resources listed for it."
    sparql:
      focus: Dashboard
      select: |
        SELECT $this WHERE {
          ?sub adp:belongsTo $this .
          FILTER NOT EXISTS { ?sub a ?kind . FILTER (?kind IN (adp:DataProduct, adp:MLModel, adp:AIModel)) }
        }

  - id: R27
    level: 2
    status: confirmed
    source: [S23]
    statement: "An ML model consists only of data products."
    sparql:
