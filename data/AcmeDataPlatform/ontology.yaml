properties:
  - id: externallyShared
    label: externally shared
    synonyms: [externally exposed]
    domain: PlatformResource
    datatype: boolean
    cardinality: "0..1"
    definition: "Whether a platform resource is exposed/shared to external applications."
    level: 3
    status: confirmed
    source: [S35]
  - id: exposedInCatalog
    label: exposed in catalog
    domain: PlatformResource
    datatype: boolean
    cardinality: "0..1"
    definition: "Whether a platform resource is exposed in the catalogs of its environments: yes by default, can be turned off."
    level: 2
    status: confirmed
    source: [S38, S49]

  - id: validUntil
    label: valid until
    domain: ElevatedPermission
    datatype: dateTime
    cardinality: "1"
    level: 3
    status: confirmed
    source: [S53]

rules:
  - id: R1
    level: 1
    status: confirmed
    source: [S3]
    statement: "Each platform service is owned by exactly one team."
    cardinality: {focus: PlatformService, path: ownedBy, min: 1, max: 1}

  - id: R2
    level: 1
    status: confirmed
    source: [S3]
    statement: "The owner of a platform service is a platform team."
    sparql:
      focus: PlatformService
      select: |
        SELECT $this WHERE { $this adp:ownedBy ?team . FILTER NOT EXISTS { ?team a adp:PlatformTeam } }

  - id: R3
    level: 1
    status: confirmed
    source: [S10, S54]
    statement: "Each (top-level or nested) platform resource is created with one or more platform services."
    cardinality: {focus: PlatformResource, path: createdWith, min: 1}

  - id: R4
    level: 1
    status: confirmed
    source: [S5]
    statement: "Each platform resource is created by exactly one team."
    cardinality: {focus: PlatformResource, path: createdBy, min: 1, max: 1}

  - id: R5
    level: 1
    status: confirmed
    source: [S4, S5]
    statement: "A platform resource is created by a product team, never by a platform team."
    sparql:
      focus: PlatformResource
      select: |
        SELECT $this WHERE { $this adp:createdBy ?team . ?team a adp:PlatformTeam . }

  - id: R6
    level: 1
    status: confirmed
    source: [S5]
    statement: "A platform resource is owned by the product team which created it."
    equal: {focus: PlatformResource, left: ownedBy, right: createdBy}

  - id: R7
    level: 1
    status: confirmed
    source: [S7, S11]
    statement: "A platform resource is created in exactly one environment."
    cardinality: {focus: PlatformResource, path: createdIn, min: 1, max: 1}

  - id: R8
    level: 1
    status: confirmed
    source: [S7, S11, S13]
    statement: "A platform resource is created in the EXP or in the DEV environment."
    values: {focus: PlatformResource, path: createdIn, in: [EXP, DEV]}

  - id: R9
    level: 1
    status: confirmed
    source: [S8, S11, S12]
    statement: "A platform resource can only be promoted to DEV, ACC or PRD."
    values: {focus: PlatformResource, path: promotedTo, in: [DEV, ACC, PRD]}

  - id: R10
    level: 1
    status: confirmed
    source: [S8, S11]
    statement: "A platform resource promoted to DEV was created in EXP."
    implies:
      focus: PlatformResource
      if: {path: promotedTo, has_value: DEV}
      then: {path: createdIn, has_value: EXP}

  - id: R11
    level: 1
    status: confirmed
    source: [S8, S11, S13]
