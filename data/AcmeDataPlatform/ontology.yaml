    statement: "After approval the team members included in a subscription request get access to the subscribed platform resource as well."
    sparql:
      focus: SubscriptionRequest
      construct: |
        CONSTRUCT { ?user adp:hasAccessTo ?resource . }
        WHERE {
          $this adp:hasStatus adp:Approved ; adp:requestFor ?resource ; adp:includesMember ?member .
          ?member adp:hasUserPrincipal ?user .
        }

  - id: R71
    level: 2
    status: confirmed
    source: [S51]
    statement: "The members included in a subscription request are members of the consumer's owner team."
    sparql:
      focus: SubscriptionRequest
      select: |
        SELECT $this WHERE {
          $this adp:includesMember ?member ; adp:requestConsumer ?consumer .
          ?consumer adp:resourceOwnedBy ?team .
          FILTER NOT EXISTS { ?member adp:memberOf ?team }
        }

  - id: R72
    level: 2
    status: confirmed
    source: [S51, S55]
    statement: "A user principal consumes a platform resource of another team only after being included in an approved subscription request."
    sparql:
      focus: UserPrincipal
      select: |
        SELECT $this WHERE {
          $this adp:userConsumes ?resource .
          ?resource adp:resourceOwnedBy ?team .
          FILTER NOT EXISTS { ?member adp:hasUserPrincipal $this ; adp:memberOf ?team . }
          FILTER NOT EXISTS { $this adp:hasAccessTo ?resource }
        }

  - id: R73
    level: 3
    status: confirmed
    source: [S53]
    statement: "An elevated permission is time-limited: it has exactly one end time."
