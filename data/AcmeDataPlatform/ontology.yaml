    statement: "Nesting has no cycles: a platform resource never belongs to itself, directly or indirectly."
    sparql:
      focus: SubPlatformResource
      select: |
        SELECT $this WHERE { $this adp:belongsTo+ $this . }

  - id: R41
    level: 2
    status: confirmed
    source: [S28, S29, S32]
    statement: "Only dashboards, AI/analytical applications and data products consume other platform resources."
    sparql:
      focus: PlatformResource
      select: |
        SELECT $this WHERE {
          $this adp:consumes ?used .
          FILTER NOT EXISTS { $this a ?kind . FILTER (?kind IN (adp:Dashboard, adp:AIAnalyticalApplication, adp:DataProduct)) }
        }

  - id: R42
    level: 2
    status: confirmed
