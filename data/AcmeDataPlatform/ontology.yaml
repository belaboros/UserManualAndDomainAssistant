  - id: R21
    level: 2
    status: confirmed
    source: [S20]
    statement: "A data product consists of a workspace infra definition."
    cardinality: {focus: DataProduct, path: ^belongsTo, class: WorkspaceInfraDefinition, min: 1}

  - id: R22
    level: 2
    status: confirmed
    source: [S20]
    statement: "A data product consists of at least one data asset."
    cardinality: {focus: DataProduct, path: ^belongsTo, class: DataAsset, min: 1}

  - id: R23
    level: 2
    status: confirmed
    source: [S20]
