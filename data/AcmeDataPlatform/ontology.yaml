    statement: "Only data products, ML models and AI models are consumed."
    sparql:
      focus: PlatformResource
      select: |
        SELECT $this WHERE {
          $this adp:consumes ?used .
          FILTER NOT EXISTS { ?used a ?kind . FILTER (?kind IN (adp:DataProduct, adp:MLModel, adp:AIModel)) }
        }

  - id: R43
