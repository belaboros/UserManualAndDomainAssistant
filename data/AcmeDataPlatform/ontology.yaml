# Source of truth for concepts (classes), individuals, relations (object properties), properties
# (data properties) and rules of AcmeDataPlatform (idea 0001). Format: tools/domain-model/README.md.
# level: 1 core | 2 main | 3 detailed (cumulative). New items get working_level.
# status: confirmed = the expert's own words; draft = wording proposed by Claude, not yet confirmed.
# Level 1 is complete (2026-11-14); the working level is 2. Drafts await the expert's confirmation.
namespace: https://example.org/acme/data-platform#
prefix: adp
label: AcmeDataPlatform
language: en
working_level: 2

concepts:
  - id: DataPlatform
    label: data platform
    level: 1
    status: confirmed
    source: [S1]
    definition: "The kind of thing AcmeDataPlatform is."

  - id: PlatformService
    label: platform service
    level: 1
    status: confirmed
    source: [S1, S2, S3, S4, S6]

  - id: PlatformResource
    label: platform resource
    level: 1
    status: confirmed
    source: [S1, S4, S5, S7, S8, S9, S11, S14, S15]

  - id: DataProduct
    label: data product
    parent: PlatformResource
    disjoint_with: [Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 1
    status: confirmed
    source: [S9, S18]

  - id: Dashboard
    label: dashboard
    parent: PlatformResource
    disjoint_with: [MLModel, AIModel, AIAnalyticalApplication]
    level: 1
    status: confirmed
    source: [S9, S18]

  - id: MLModel
    label: ML model
    parent: PlatformResource
    disjoint_with: [AIModel, AIAnalyticalApplication]
    level: 1
    status: confirmed
    source: [S9, S18]

  - id: AIModel
    label: AI model
    parent: PlatformResource
    disjoint_with: [AIAnalyticalApplication]
    level: 1
    status: confirmed
    source: [S9, S18]

  - id: AIAnalyticalApplication
    label: AI/analytical application
    parent: PlatformResource
    level: 1
    status: confirmed
    source: [S9]

  - id: SubPlatformResource
    label: sub platform resource
    synonyms: [nested platform resource]
    parent: PlatformResource
    definition: "A platform resource that belongs to a parent platform resource and cannot live on its own."
    level: 2
    status: confirmed
    source: [S18]

  - id: DataContract
    label: contract
    parent: SubPlatformResource
    disjoint_with: [DataPipeline, ComputeClusterDefinition, WorkspaceInfraDefinition, DataAsset, DataProduct, Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 2
    status: confirmed
    source: [S20]

  - id: DataPipeline
    label: data pipeline
    parent: SubPlatformResource
    disjoint_with: [ComputeClusterDefinition, WorkspaceInfraDefinition, DataAsset, DataProduct, Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 2
    status: confirmed
    source: [S20]

  - id: ComputeClusterDefinition
    label: compute cluster definition
    parent: SubPlatformResource
    disjoint_with: [WorkspaceInfraDefinition, DataAsset, DataProduct, Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 2
    status: confirmed
    source: [S20]

  - id: WorkspaceInfraDefinition
    label: workspace infra definition
    parent: SubPlatformResource
    disjoint_with: [DataAsset, DataProduct, Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 2
    status: confirmed
    source: [S20]

  - id: DataAsset
    label: data asset
    definition: "A part of a data product holding its data; typically tables and views in case of structured data products."
    parent: SubPlatformResource
    disjoint_with: [DataProduct, Dashboard, MLModel, AIModel, AIAnalyticalApplication]
    level: 2
    status: confirmed
    source: [S20]

  - id: ParentDataProduct
    label: parent data product
    synonyms: [upstream data product]
    parent: DataProduct
    definition: "A data product another data product depends on."
    level: 2
    status: confirmed
    source: [S24]

  - id: ChildDataProduct
    label: child data product
    synonyms: [downstream data product]
    parent: DataProduct
    definition: "A data product that depends on one or more parent data products."
    level: 2
    status: confirmed
    source: [S24]

  - id: Table
    label: table
    parent: DataAsset
    disjoint_with: [View]
    level: 3
    status: confirmed
    source: [S20]

  - id: View
    label: view
    parent: DataAsset
    level: 3
    status: confirmed
    source: [S20]

  - id: IngestionDataPipeline
    label: ingestion data pipeline
    parent: DataPipeline
    disjoint_with: [ProcessingDataPipeline]
    definition: "A data pipeline that ingests data from an (internal or external) source service or data source and stores it unchanged in the RAW layer."
    level: 2
    status: confirmed
    source: [S25, S30]

  - id: ProcessingDataPipeline
    label: processing data pipeline
    parent: DataPipeline
    definition: "A data pipeline that performs transformations (cleansing, curation, filtering, enrichment, aggregation) across the RAW->CURATED->SERVING medallion layers."
    level: 2
    status: confirmed
    source: [S25, S30]

  - id: DataSource
    label: data source
    synonyms: [source service]
    definition: "An internal or external service or data source that an ingestion data pipeline ingests data from."
    level: 2
    status: confirmed
    source: [S25]

  - id: MedallionLayer
    label: medallion layer
    level: 2
    status: confirmed
    source: [S25]

  - id: Principal
    label: principal
    definition: "Someone or something that consumes platform resources: a user principal or a service principal."
    level: 2
    status: confirmed
    source: [S33]

  - id: UserPrincipal
    label: user principal
    synonyms: [human user]
    parent: Principal
    disjoint_with: [ServicePrincipal]
    definition: "The identity of a user or group of users who can look at dashboards and use AI/analytical applications."
    level: 2
    status: confirmed
    source: [S33, S34]

  - id: ServicePrincipal
    label: service principal
    synonyms: [application consumer]
    parent: Principal
    definition: "The identity of an application, data pipeline or other automation which is not performed by a human."
    level: 2
    status: confirmed
    source: [S33, S34]

  - id: ExternalApplication
    label: external application
    definition: "An application that runs outside of the data platform and consumes the externally exposed/shared platform resources."
    level: 3
    status: confirmed
    source: [S35]

  - id: ProductOwner
    label: product owner
    parent: Employee
    definition: "The member of the owner product team who owns a platform resource on its behalf."
    level: 2
    status: confirmed
    source: [S37, S50]

  - id: DataProductOwner
    label: data product owner
    parent: ProductOwner
    definition: "The product owner of a data product."
    level: 2
    status: confirmed
    source: [S36]

  - id: Catalog
    label: catalog
    definition: "Where the platform resources of one environment are exposed (findable) for anyone inside ACME company; there is a catalog per environment."
    level: 2
    status: confirmed
    source: [S38, S49]

  - id: SubscriptionRequest
    label: subscription request
    definition: "A request by a product owner to consume an existing platform resource, to build a new platform resource or to consume it by another application."
    level: 2
    status: confirmed
    source: [S40, S41]

  - id: SubscriptionStatus
    label: subscription status
    level: 2
    status: confirmed
    source: [S41]

  - id: Employee
    label: employee
    definition: "A person working for ACME company, e.g. a product owner or data product owner."
    level: 2
    status: confirmed
    source: [S50]

  - id: Developer
    label: developer
    parent: Employee
    definition: "An employee who develops a consumer application or other platform resource."
    level: 3
    status: confirmed
    source: [S53]

  - id: Permission
    label: permission
    definition: "Access for a user principal to tables/views in one environment, e.g. SELECT; access for users can be differentiated per environment."
    level: 3
    status: confirmed
    source: [S52]

  - id: ElevatedPermission
    label: elevated permission
    parent: Permission
    definition: "A time-limited permission a developer of the consumer application requests to run SELECT commands on tables/views in their data product or in the parent data products, for incident resolution or debugging."
    level: 3
    status: confirmed
    source: [S53]

  - id: Privilege
    label: privilege
    level: 3
    status: confirmed
    source: [S52, S53]

  - id: Purpose
    label: purpose
    level: 3
    status: confirmed
    source: [S53]

  - id: AccessRestriction
    label: access restriction
    definition: "A limit a product owner intentionally sets on the default read access of the owner team's members to their own platform resource, in some environments (e.g. not in PRD, which contains sensitive/PII information)."
    level: 3
    status: confirmed
    source: [S55, S56]

  - id: Team
    label: team
    level: 1
    status: confirmed
    source: [S10]

  - id: PlatformTeam
    label: platform team
    parent: Team
    disjoint_with: [ProductTeam]
    level: 1
    status: confirmed
    source: [S1, S3, S10]

  - id: ProductTeam
    label: product team
    parent: Team
    level: 1
    status: confirmed
    source: [S1, S4, S5, S10]

  - id: Environment
    label: environment
    level: 1
    status: confirmed
    source: [S1, S6, S7, S8]

